# Automated Sprite Audit & Zero-Commit GitHub Pages Deployment
name: Audit Sprites & Deploy to Pages

on:
  # Runs on pushes and PR merges targeting the master branch
  push:
    branches: ["master"]
    paths:
      - 'sprites/**'
      - 'scripts/tracker/**'
      - 'website/**'
      - '.github/workflows/static.yml'

  # Allows manual runs from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to deploy to GitHub Pages and publish releases
permissions:
  contents: write
  pages: write
  id-token: write

# Serialize deployments and preserve queued runs so sprite changes are not skipped.
concurrency:
  group: "pages"
  cancel-in-progress: false
  queue: max

jobs:
  audit-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install audit dependencies
        run: |
          pip install pillow jinja2

      - name: Run Sprite Audit & Build Dashboard
        run: |
          python scripts/tracker/sprite_audit.py --category all --include-forms --build-index

      - name: Generate Sprite Manifest JSON
        run: |
          mkdir -p ./website
          git ls-files sprites/ | sed 's|^sprites/||' | jq -R -s 'split("\n")[:-1]' > ./website/manifest.json
          gzip -k -9 -c ./website/manifest.json > ./website/manifest.json.gz

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Publish Manifest to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Latest Sprites Index"
          draft: false
          prerelease: false
          files: |
            ./website/manifest.json
            ./website/manifest.json.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for sprite changes
        id: sprite-changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            sprites:
              - added|deleted: 'sprites/**'

      - name: Trigger API data rebuild
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.sprite-changes.outputs.sprites == 'true'
        env:
          CIRCLECI_TOKEN: ${{ secrets.NARAMSIM_CIRCLECI_WRITE_TOKEN }}
        run: |
          if [ -z "${CIRCLECI_TOKEN}" ]; then
            echo "::error::Set CIRCLECI_TOKEN to a CircleCI personal API token with write access to PokeAPI/pokeapi."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --request POST \
            --header "Circle-Token: ${CIRCLECI_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"branch":"master"}' \
            https://circleci.com/api/v2/project/gh/PokeAPI/pokeapi/pipeline
